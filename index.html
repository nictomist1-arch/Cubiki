<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Cubiki — мультиплеер</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <div id="join-screen">
    <div class="join-card">
      <h1>Cubiki</h1>
      <p>Мультиплеерная игра с кубиками в реальном времени</p>
      <input id="player-name" type="text" placeholder="Ваше имя" maxlength="20" autocomplete="off">

      <div class="customize-section">
        <label class="customize-label">Комната</label>
        <input id="room-code" type="text" placeholder="lobby" maxlength="16" autocomplete="off">
        <p class="field-hint">Введите название или выберите из списка. Одинаковое имя = одна комната.</p>
      </div>

      <div class="customize-section">
        <label class="customize-label">Активные комнаты</label>
        <div id="rooms-list" class="rooms-list">
          <p class="rooms-empty">Загрузка...</p>
        </div>
      </div>

      <div class="customize-section">
        <label class="customize-label">Цвет кубика</label>
        <input id="player-color" type="color" value="#4ecdc4">
      </div>

      <div class="customize-section">
        <label class="customize-label">Форма</label>
        <div class="shape-picker" id="shape-picker">
          <button type="button" class="shape-btn active" data-shape="cube" title="Куб">⬛</button>
          <button type="button" class="shape-btn" data-shape="sphere" title="Сфера">⚫</button>
          <button type="button" class="shape-btn" data-shape="diamond" title="Ромб">🔷</button>
          <button type="button" class="shape-btn" data-shape="cylinder" title="Цилиндр">🛢</button>
        </div>
      </div>

      <div class="customize-section">
        <label class="customize-label">Размер</label>
        <input id="player-size" type="range" min="0.7" max="1.5" step="0.1" value="1">
        <span id="size-value">1.0</span>
      </div>

      <button id="join-btn">Войти в игру</button>
      <div id="network-urls" class="hint"></div>
    </div>
  </div>

  <div id="hud" class="hidden">
    <div id="room-badge"></div>
    <div id="players-list"></div>
    <div id="controls-hint">
      <strong>WASD</strong> — движение &nbsp;|&nbsp;
      <strong>Пробел</strong> — прыжок &nbsp;|&nbsp;
      <strong>E</strong> — отталкивание &nbsp;|&nbsp;
      <strong>T</strong> — чат &nbsp;|&nbsp;
      <strong>📷</strong> — камера
    </div>
    <div id="status">Подключение...</div>

    <div id="chat-panel">
      <div id="chat-messages"></div>
      <div id="chat-input-row">
        <input id="chat-input" type="text" placeholder="Сообщение... (Enter)" maxlength="120" autocomplete="off">
        <button id="chat-send" type="button">➤</button>
      </div>
    </div>

    <div id="mobile-controls" class="hidden">
      <div id="touch-move">
        <button type="button" class="touch-btn" data-key="KeyW">▲</button>
        <div class="touch-row">
          <button type="button" class="touch-btn" data-key="KeyA">◀</button>
          <button type="button" class="touch-btn" data-key="KeyS">▼</button>
          <button type="button" class="touch-btn" data-key="KeyD">▶</button>
        </div>
      </div>
      <div id="touch-actions">
        <button type="button" class="touch-action" data-key="Space">Прыжок</button>
        <button type="button" class="touch-action" data-key="KeyE">Толчок</button>
      </div>
    </div>

    <button id="camera-reset-btn" type="button" title="Сбросить камеру">📷</button>
    <button id="customize-btn" type="button" title="Персонализация">🎨</button>
    <div id="customize-panel" class="hidden">
      <h3>Персонализация</h3>
      <label>Цвет <input id="ingame-color" type="color"></label>
      <label>Форма
        <select id="ingame-shape">
          <option value="cube">Куб</option>
          <option value="sphere">Сфера</option>
          <option value="diamond">Ромб</option>
          <option value="cylinder">Цилиндр</option>
        </select>
      </label>
      <label>Размер <input id="ingame-size" type="range" min="0.7" max="1.5" step="0.1" value="1"></label>
      <button id="apply-customize" type="button">Применить</button>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
